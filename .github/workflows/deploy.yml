
name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --watch=false

      - name: Build Angular
        run: npm run build -- --base-href /Uceva-Pipeline-App/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/pipeline-app/browser

  # Despliegue
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verify the deployed site is online
        run: >-
          curl --fail --silent --show-error --location
          --retry 10 --retry-delay 10 --retry-all-errors
          "${{ needs.deploy.outputs.page_url }}"
