<div class="site-shell">
  <header class="site-header">
    <a class="brand" routerLink="/home" aria-label="Pipeline Lab, inicio">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="brand-copy">
        <span class="brand-name">pipeline<span>lab</span></span>
        <span class="brand-caption">UCEVA · Arquitectura de software</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>01</span> Inicio
      </a>
      <a routerLink="/about" routerLinkActive="active">
        <span>02</span> Acerca de
      </a>
      <a routerLink="/contact" routerLinkActive="active">
        <span>03</span> Contacto
      </a>
    </nav>

    <a
      class="header-link"
      href="https://github.com/Felipe-Marulanda/Uceva-Pipeline-App"
      target="_blank"
      rel="noopener noreferrer"
    >
      Ver repositorio <span aria-hidden="true">↗</span>
    </a>
  </header>

  <main id="main-content" class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <span>Un laboratorio para aprender haciendo.</span>
    <span>Angular <i aria-hidden="true">·</i> GitHub Actions <i aria-hidden="true">·</i> Pages</span>
  </footer>
</div>
